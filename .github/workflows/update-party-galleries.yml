name: Update Party Galleries

on:
  push:
    paths:
      - "gallery/party-galleries/**"
      - "scripts/build-party-galleries.js"
      - ".github/workflows/update-party-galleries.yml"

permissions:
  contents: write

jobs:
  build-party-galleries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build party gallery pages
        run: node scripts/build-party-galleries.js
      - name: Save generated gallery pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- gallery/party-galleries/party-galleries.json 'party-*.html'
          if git diff --cached --quiet; then
            echo "Party galleries are already current."
          else
            git commit -m "Update automatic party galleries"
            git push
          fi
